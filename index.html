	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
    <style>  
        body {
			margin: 0;
			/* 添加背景图片 */
			background-image: url('https://s41.ax1x.com/2026/02/03/pZ5rkB6.png');
			/* 让背景图片覆盖整个屏幕，不随页面滚动（固定背景） */
			background-attachment: fixed;
			/* 确保图片自动缩放以填满屏幕，同时保持比例 */
			background-size: cover;
			/* 背景图居中显示 */
			background-position: center 40%;
			/* 防止图片过小导致的平铺重复 */
			background-repeat: no-repeat;
		}
		@keyframes gradientFlip {
			0% {
				background-position: 0% 50%; /* 初始：绿在左，紫在右 */
			}
			50% {
				background-position: 100% 50%; /* 中间：紫移到左边，绿移到右边 */
			}
			100% {
				background-position: 0% 50%; /* 回归：绿又回到左边 */
			}
		}
		@keyframes glowPulse {  /* 1. 定义平滑的呼吸/缩放动画 */
			0% { 
				filter: blur(10px); 
				opacity: 0.8; 
				transform: scale(1); 
				box-shadow: 0 0 20px #ff9d00; /* 增加内发光感 */
			}
			50% { 
				filter: blur(20px); 
				opacity: 1; 
				transform: scale(1.15);
				box-shadow: 0 0 40px #ffcc00; /* 扩展光影范围 */ 
			}
			100% { 
				filter: blur(10px); 
				opacity: 0.8; 
				transform: scale(1); 
				box-shadow: 0 0 20px #ff9d00;
			}
		}
		/* 2. 背景装饰 */
		.avatar-wrapper {
			position: relative;
			display: inline-block;
			z-index: 1;
		}
		.avatar-wrapper::before {
			content: "";
			position: absolute;
			/* 调整外扩范围，数值越大光晕越宽 */
			top: -3px; left: -3px; right: -3px; bottom: -3px;
			
			background: radial-gradient(circle, #fff 0%, #ffd700 40%, #ff4500 100%);
			
			border-radius: 50%;
			z-index: -1;
			
			/* 使用呼吸动画，如果想让它静止，可以直接删除下面这行 */
			animation: glowPulse 4s ease-in-out infinite;
		}
		.larger-text {
			font-family: 'Noto Serif SC', serif;
			font-size: 40px;
			font-weight: bold;
			line-height: 1.5; /* 确保高度充足，不被切断 */
			display: inline-block;
			
			/* 设置渐变：绿 -> 紫 -> 绿 */
			/* 这样排列是为了在动画移动时，看起来像是在两个颜色间平滑反转 */
			background: linear-gradient(
				70deg, 
				rgb(255, 167, 69),
				rgb(254, 134, 159),
				rgb(239, 122, 200),
				rgb(160, 131, 237),
				rgb(67, 174, 255),
				rgb(160, 131, 237),
				rgb(239, 122, 200),
				rgb(254, 134, 159),
				rgb(255, 167, 69)
			);
			background-size: 200% 100%; /* 宽度设为200%，这样我们可以左右滑动它 */
			-webkit-background-clip: text; 
			background-clip: text;
			color: transparent;
			/* 绑定动画：这里时间可以调慢一点，更有呼吸感 */
			animation: gradientFlip 8s ease-in-out infinite;

		}
		.large-text {
			font-family: "Times New Roman", Times, serif;
			font-size: 27px;
			color: #B03060;
			text-shadow: 0.5px 0.5px 1px rgba(255, 255, 255, 0.8);

		}
		p {

		}
		.medium-text {
			line-height: 65px;
			font-size: 20px;
			margin: 5px 0;
		}
		.container {
			display: grid;
			grid-template-columns: repeat(2, 1fr); 
			gap: 35px; /* 列间距 */
			justify-items: center; /* 关键：让子元素在单元格内水平居中 */

		}
		.item {
            width: 90%;          /* 默认占据父容器的 90% */
    		max-width: 450px;    /* 但最大不超过 450px */
            height: 456px;
            background-color: #75ffdfe5;
            border-radius: 40px;
			margin: 15px auto;
			text-align: center;
			padding: 20px; /* 增加内边距 */
    		box-sizing: border-box; /* 确保 padding 不撑大盒子 */
			background-color: rgba(255, 255, 255, 0.4); /* 半透明白色 */
			backdrop-filter: blur(10px);              /* 关键：背景模糊，非常有高级感 */
			-webkit-backdrop-filter: blur(10px);
			border: 1px solid rgba(255, 255, 255, 0.3);
        }
		.list-content {
			display: inline-block; /* 关键：让容器宽度等于内容宽度 */
			text-align: left;      /* 关键：让内部文字左对齐 */
			vertical-align: top;
			margin-top: 10px;
		}
		.footer-container {
			/* 采用亮色渐变，上方透明，下方微白，实现与背景的自然过渡 */
			background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.7)); 
			backdrop-filter: blur(8px); /* 磨砂效果，让黑色文字更清晰 */

			padding: 30px 20px;
			margin-top: 30px; /* 与上方内容拉开距离 */

		.footer-link:hover {

		.footer-info p, .footer-info a {

		.footer-info a:hover {

		.copyright {

		}
		.larger-text, .large-text, .medium-text, .item b {

		}

		/* --- 电脑端：锁定两列布局 --- */
		@media (min-width: 851px) {
			body {

				overflow-x: auto;  /* 放大时出现横向滚动条 */
			}
			.container {
				display: grid;

				width: 1000px;
				margin: 0 auto;
				gap: 9vw;
        		justify-content: center; /* 确保两个块整体在页面居中 */
			}
			.item {
				width: 450px !important; /* 卡片宽度锁死 */
			}
			.pc-text {
				line-height: 65px;
				font-size: 20px;
				margin: 5px 0;
			}
			.mobile-text {
				display: none;
			}
		}
		/* 针对屏幕宽度小于 850px 的设备（手机和平板） */
		@media (max-width: 850px) {
			body {
				width: 100%;
				min-width: auto; 
				overflow-x: hidden;
				margin: 0;
				padding: 0;
			}
			/* 1. 让两列布局变成单列布局 */
			.container {
				display: flex;
				flex-direction: column;
				align-items: center;   /* 确保卡片在手机屏幕水平居中 */
				width: 100%;
				padding: 0 10px;            /* 缩小左右边距 */
				gap: 20px;                  /* 缩小间距 */
				box-sizing: border-box;
			}

			/* 2. 让卡片宽度自适应，不再固定 450px */
			.item {
				width: 95%;       /* 占据屏幕可用宽度的全部 */
				max-width: 450px;  
				height: auto;      /* 高度改为自动，防止文字被溢出 */
				min-height: 350px; /* 设置一个最小高度保持美观 */
				margin: 10px 0;
				box-sizing: border-box; /* 极其重要：防止 padding 撑开宽度 */
			}
			.list-content {
				/* 关键修改： */
				display: block;      /* 改为 block 方便控制边距 */
				text-align: left;    /* 内容本身左对齐 */
				width: 85%;  /* 宽度根据文字长度自适应 */
				
				/* 这里的 margin 控制位置：
				第一个 0 是上下边距，
				第二个 auto 配合左边距实现整体位置微调 */
				margin: 0 auto 0 4%; 
				position: relative;
			}
			.larger-text {
				font-size: 35px;
				font-family: 'Noto Serif SC', serif;
			}
			.large-text {
				font-size: 24px;
				white-space: nowrap;
			}
			.medium-text {
				font-size: 15px;      /* 手机端文字缩小一点 */
				line-height: 2.2;
				margin: 10px 0;       /* 调整每行之间的外边距，防止贴得太紧 */ 
			}
			.pc-text {
				display: none; /* 手机端隐藏电脑文字 */
			}
			.mobile-text {
				font-size: 15px;      /* 手机端文字缩小一点 */
				line-height: 2.2;
				margin: 10px 0;       /* 调整每行之间的外边距，防止贴得太紧 */

			/* 4. 底部联系方式在手机上改为上下排列 */
			.footer-info {
				flex-direction: column; 
				gap: 10px;
			}
		}

	<script>
	const canvas = document.getElementById('particleCanvas');
	const ctx = canvas.getContext('2d');

	let particles = [];
	const particleCount = 60; // 粒子数量

	function resize() {
		canvas.width = window.innerWidth;
		canvas.height = window.innerHeight;
	}

	window.addEventListener('resize', resize);
	resize();

	class Particle {
		constructor() {
			this.reset();
		}
		reset() {
			this.x = Math.random() * canvas.width;
			this.y = Math.random() * canvas.height;
			this.size = Math.random() * 2 + 1;
			this.speedX = Math.random() * 0.5 - 0.25;
			this.speedY = Math.random() * 0.5 - 0.25;
			this.opacity = Math.random() * 0.5 + 0.1;
		}
		update() {
			this.x += this.speedX;
			this.y += this.speedY;
			if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
				this.reset();
			}
		}
		draw() {
			ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity + 0.2})`; // 使用你喜欢的青色
			ctx.beginPath();
			ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
			ctx.fill();
		}
	}

	function init() {
		for (let i = 0; i < particleCount; i++) {
			particles.push(new Particle());
		}
	}

	function animate() {
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		particles.forEach(p => {
			p.update();
			p.draw();
		});
		requestAnimationFrame(animate);
	}
	init();
	animate();
	</script>
